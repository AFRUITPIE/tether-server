name: Publish to npm

# A GitHub release (made by `mise run release`) publishes the same version to npm by trusted
# publishing: npm takes this workflow's OIDC token instead of a stored one, and records where the
# package was built (provenance). The package's trusted publisher on npmjs.com names this repository
# and this file.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run scripts/build-npm.ts
      # What npm will serve, run the way a host runs it.
      - run: node npm/cli.js version --json
      - run: npm publish ./npm --access public
