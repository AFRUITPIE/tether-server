[tools]
bun = "1.3.14"

[tasks.install]
run = "bun install"

[tasks.test]
run = "bun test"

[tasks.typecheck]
run = "bunx tsc --noEmit"

[tasks.dev]
run = "bun run src/cli.ts serve --stdio"

[tasks.gen]
run = "bun run scripts/gen-schema.ts && bun run scripts/gen-swift.ts"

[tasks.release]
description = "Compile the binaries and publish them as a GitHub release for the current version"
run = "bun run scripts/release.ts"

[tasks.compile]
run = "bun run scripts/compile.ts"

[tasks.e2e]
description = "End-to-end tests against the real `claude` on PATH (costs a few cents on haiku)"
run = ["bun run scripts/e2e.ts", "bun run scripts/e2e-daemon.ts"]

[tasks.swift-test]
run = "swift test"
